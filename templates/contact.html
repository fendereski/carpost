<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .slide { background: radial-gradient(1200px 900px at 80% 10%, rgba(255,255,255,0.08), transparent 60%), linear-gradient(160deg, #10161e 0%, #0b0f14 60%, #07090c 100%); }
  .photo-dim { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.22; filter: saturate(0.6); }
  .veil { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,9,12,0.98) 0%, rgba(7,9,12,0.75) 55%, rgba(7,9,12,0.45) 100%); }
  .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 14px; background: var(--accent); }
  .wrap { position: absolute; inset: 0; padding: 96px 80px 60px; display: flex; flex-direction: column; }
  .logo-row { display: flex; align-items: center; gap: 26px; }
  .logo-row.stack { flex-direction: column; align-items: flex-end; gap: 12px; }
  .logo-row img { height: 104px; width: auto; max-width: 440px; object-fit: contain; filter: drop-shadow(0 3px 14px rgba(0,0,0,0.55)); }
  .logo-row .sub.under { font-size: 26px; color: var(--muted); font-weight: 500; }
  .logo-row .name { font-size: 64px; font-weight: 900; letter-spacing: -1px; }
  .logo-row .sub { font-size: 26px; color: var(--muted); font-weight: 500; margin-top: 6px; }
  .headline { margin-top: 44px; font-size: 52px; font-weight: 900; line-height: 1.3; }
  .headline em { font-style: normal; color: var(--accent); }
  .lead { margin-top: 14px; font-size: 26px; color: var(--muted); font-weight: 500; line-height: 1.6; }
  .rows { margin-top: 30px; margin-bottom: 28px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 20px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.14); border-radius: 22px; padding: 12px 24px; }
  .row .ico { width: 64px; height: 64px; flex: 0 0 64px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); border-radius: 16px; }
  .row .ico svg { width: 36px; height: 36px; }
  .row .txt { display: flex; flex-direction: column; gap: 4px; }
  .row .big { font-size: 36px; font-weight: 900; }
  .row .small { font-size: 21px; color: var(--muted); font-weight: 500; }
  .row .big.latin { letter-spacing: 1px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 22px; }
</style>
</head>
<body>
<div class="slide">
  {{bg_photo_html}}
  <div class="veil"></div>
  <div class="accent-line"></div>
  <div class="wrap">
    <div class="logo-row{{logo_row_class}}">{{logo_row_html}}</div>
    <div class="headline">{{headline}}</div>
    <div class="lead">{{lead}}</div>
    <div class="rows">{{rows_html}}</div>
    <div class="foot">
      <span>{{foot_right}}</span>
      <span class="latin">{{foot_left}}</span>
    </div>
  </div>
</div>
</body>
</html>
